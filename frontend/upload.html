<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume to Portfolio - Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }

        .upload-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 90%;
            max-width: 600px;
            padding: clamp(20px, 5vw, 50px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            color: #333;
            margin-bottom: clamp(8px, 2vh, 15px);
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            margin-bottom: clamp(20px, 4vh, 35px);
            font-size: clamp(13px, 2.5vw, 16px);
            line-height: 1.4;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: clamp(20px, 4vh, 40px);
            margin-bottom: clamp(15px, 3vh, 25px);
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .upload-area:hover,
        .upload-area.drag-over {
            background-color: #f0f4ff;
            border-color: #764ba2;
            transform: translateY(-2px);
        }

        .upload-area.drag-over {
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: clamp(36px, 8vw, 52px);
            margin-bottom: clamp(10px, 2vh, 20px);
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: clamp(10px, 2vh, 14px) clamp(20px, 4vw, 35px);
            background-color: #667eea;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(13px, 2.5vw, 16px);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .file-label:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .file-name {
            margin-top: clamp(10px, 2vh, 15px);
            color: #666;
            font-size: clamp(12px, 2vw, 14px);
            word-break: break-word;
        }

        button {
            padding: clamp(12px, 2.5vh, 16px) clamp(30px, 6vw, 45px);
            font-size: clamp(14px, 3vw, 18px);
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: clamp(10px, 2vh, 20px);
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            max-width: 280px;
        }

        button:hover:not(:disabled) {
            background-color: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .note {
            margin-top: clamp(15px, 3vh, 25px);
            padding: clamp(12px, 2vh, 16px);
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            text-align: left;
            font-size: clamp(11px, 2vw, 14px);
            color: #856404;
            border-radius: 5px;
            line-height: 1.6;
        }

        .note strong {
            display: block;
            margin-bottom: 8px;
        }

        /* Mobile optimization */
        @media (max-width: 600px) {
            .upload-container {
                width: 95%;
                padding: 25px;
                max-height: 95vh;
            }

            .upload-area {
                padding: 25px 15px;
            }

            button {
                max-width: 100%;
            }
        }

        /* Small mobile devices */
        @media (max-width: 400px) {
            .upload-container {
                width: 98%;
                padding: 20px 15px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }
        }

        /* Tablet landscape */
        @media (min-width: 601px) and (max-width: 1024px) {
            .upload-container {
                max-width: 550px;
            }
        }

        /* Very small screens height */
        @media (max-height: 600px) {
            .upload-container {
                padding: 15px;
                max-height: 98vh;
            }

            .note {
                font-size: 11px;
                padding: 10px;
            }

            .upload-area {
                padding: 20px;
            }

            h1 {
                margin-bottom: 5px;
            }

            .subtitle {
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="upload-container">
        <h1>📄 Resume to Portfolio</h1>
        <p class="subtitle">Transform your resume into a professional portfolio website</p>

        <form id="upload-form" onsubmit="handleSubmit(event)">
            <div class="upload-area" id="drop-zone" onclick="document.getElementById('resume').click()">
                <div class="upload-icon">📤</div>
                <label for="resume" class="file-label">Choose or Drag PDF Resume</label>
                <input type="file" id="resume" name="file" accept=".pdf" onchange="showFileName()">
                <div class="file-name" id="file-name">No file selected</div>
            </div>

            <button type="submit" id="submit-btn">Upload & Continue →</button>
        </form>

        <div class="note">
            <strong>What happens next?</strong>
            1. We'll extract your resume information<br>
            2. You can review and edit the details<br>
            3. Generate your portfolio website
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('resume');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Drag and drop event listeners
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');

            if (e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    fileInput.files = e.dataTransfer.files;
                    showFileName();
                } else {
                    alert('Please drop a PDF file only!');
                }
            }
        });

        function showFileName() {
            const input = document.getElementById('resume');
            const fileNameDiv = document.getElementById('file-name');

            if (input.files.length > 0) {
                fileNameDiv.textContent = input.files[0].name;
                fileNameDiv.style.color = '#28a745';
                fileNameDiv.style.fontWeight = '600';
            } else {
                fileNameDiv.textContent = 'No file selected';
                fileNameDiv.style.color = '#666';
                fileNameDiv.style.fontWeight = 'normal';
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            event.stopPropagation();

            const fileInput = document.getElementById('resume');
            const submitBtn = document.getElementById('submit-btn');

            if (!fileInput.files.length) {
                alert('Please select a PDF file first!');
                return;
            }

            // Validate file type
            const file = fileInput.files[0];
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                alert('Please select a PDF file only!');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload-resume-web', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const html = await response.text();

                    // Successfully received HTML, display it
                    submitBtn.textContent = 'Processing...';

                    // Replace current page with editor
                    document.open();
                    document.write(html);
                    document.close();
                } else {
                    // Server returned an error
                    const errorText = await response.text().catch(() => 'Unknown error');
                    console.error('Server error:', errorText);

                    alert('Error reading your resume.\n\nPlease try:\n1. Re-downloading your PDF\n2. Converting to standard PDF format\n3. Upload again');

                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Upload & Continue →';
                }
            } catch (error) {
                console.error('Connection error:', error);

                alert('Cannot connect to server!\n\nPlease ensure the backend is running and try again.');

                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload & Continue →';
            }
        }
    </script>

</body>

</html>
